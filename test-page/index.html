<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dweller backend test page</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1.5rem;
    color: #1a1a1a;
  }
  h1 {
    font-size: 1.25rem;
    margin-bottom: 0.25rem;
  }
  p.sub {
    color: #666;
    margin-top: 0;
    margin-bottom: 2rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  input[type="text"] {
    width: 100%;
    padding: 0.5rem;
    font-size: 1rem;
    box-sizing: border-box;
    margin-bottom: 1rem;
  }
  button {
    padding: 0.6rem 1.25rem;
    font-size: 1rem;
    cursor: pointer;
    margin-bottom: 1.5rem;
  }
  button:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }
  #status {
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
  }
  pre {
    background: #f4f4f4;
    border: 1px solid #ddd;
    padding: 1rem;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<h1>Dweller backend test page</h1>
<p class="sub">Not the real frontend — just confirms the backend API returns data for a postcode.</p>

<label for="apiBase">Backend API base URL</label>
<input type="text" id="apiBase" placeholder="https://your-vercel-deployment.vercel.app">

<label for="postcode">UK postcode</label>
<input type="text" id="postcode" placeholder="SW1A 1AA">

<button id="submit">Get report</button>

<div id="status"></div>
<pre id="result">(no request made yet)</pre>

<script>
  const apiBaseInput = document.getElementById('apiBase');
  const postcodeInput = document.getElementById('postcode');
  const submitButton = document.getElementById('submit');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');

  // Remember the API base URL between visits so it doesn't need retyping.
  apiBaseInput.value = localStorage.getItem('dweller_test_api_base') || '';

  async function runLookup() {
    const apiBase = apiBaseInput.value.trim().replace(/\/$/, '');
    const postcode = postcodeInput.value.trim();

    if (!apiBase) {
      statusEl.textContent = 'Enter the backend API base URL first.';
      return;
    }
    if (!postcode) {
      statusEl.textContent = 'Enter a postcode first.';
      return;
    }

    localStorage.setItem('dweller_test_api_base', apiBase);

    submitButton.disabled = true;
    statusEl.textContent = 'Requesting…';
    resultEl.textContent = '';

    const url = `${apiBase}/api/report?postcode=${encodeURIComponent(postcode)}`;

    try {
      const start = Date.now();
      const res = await fetch(url);
      const elapsedMs = Date.now() - start;
      const text = await res.text();

      let body = text;
      try {
        body = JSON.stringify(JSON.parse(text), null, 2);
      } catch (e) {
        // not JSON, show raw text as-is
      }

      statusEl.textContent = `HTTP ${res.status} — ${elapsedMs}ms`;
      resultEl.textContent = body;
    } catch (err) {
      statusEl.textContent = 'Request failed.';
      resultEl.textContent = String(err);
    } finally {
      submitButton.disabled = false;
    }
  }

  submitButton.addEventListener('click', runLookup);
  postcodeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') runLookup();
  });
</script>

</body>
</html>
